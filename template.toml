name = "pj-react-web"
version = "0.2.0"

# Vite + React + TypeScript + Tailwind framework layer. Sits above
# `pj-pnpm` (which supplies package.json / pnpm scripts) and adds
# the Vite/React/Tailwind/Vitest scaffolding plus a minimal
# `src/` skeleton suitable for `pnpm dev` to boot a working page.
#
# Compose order: pj-base → pj-pnpm → pj-react-web. Conflicts on
# tsconfig.json etc. resolve in this layer's favour because it
# composes later.

# tsconfig.app.json — browser-side TS config. The `compilerOptions`
# block is the part worth keeping uniform across the React projects
# using these templates, but `include` is not: it is a statement
# about the consumer's own directory layout. A project that keeps a
# `shared/` directory consumed by both the browser and the server
# half needs `["src", "shared"]` here, and kata has no way to know
# that. Managing this file `always` reverted exactly that array on
# every `kata apply`, silently dropping whole directories out of the
# type-check.
#
# `merge-json` with `paths = ["compilerOptions"]` would be the
# surgical fix, but kata's merge-json parses both sides with strict
# `serde_json` and this file carries JSONC comments (`/* Bundler
# mode */`, `/* Linting */`), so it would fail the apply outright.
# Hence `when = "once"`: ship the opinionated starter, then leave it
# to the consumer.
[[file]]
src = "tsconfig.app.json"
how = "overwrite"
when = "once"

# tsconfig.node.json — config for vite.config.ts and any node-side
# scripts. `when = "once"` for the same reason as tsconfig.app.json:
# its `include` array is the consumer's inventory of everything that
# is not browser code — an `api/` directory of server routes, extra
# build or codegen scripts, the `shared/` directory again — and this
# layer only knows about `vite.config.ts`. Reverting the array here
# stopped type-checking the entire server half of a consumer project.
# JSONC comments rule out the merge-json alternative here too.
[[file]]
src = "tsconfig.node.json"
how = "overwrite"
when = "once"

# Vite config — `vite.config.ts` is consumer-owned territory in
# practice (each PJ stacks its own plugins: VitePWA, Sentry,
# vitest config inheritance, custom dev-only loggers, …). We
# can't keep it `always`-managed without clobbering those
# extensions on every `kata apply`, and TS isn't a structured
# format that `merge-toml` / `merge-yaml` could splice safely.
#
# So this layer ships an opinionated starter (`react()` plugin
# + `host: true` + `.ts.net` / `.local` allowlist for Tailscale
# / LAN previews) as `when = "once"`. The Tailscale allowlist
# is the one bit consumers should *re-apply by hand* if they
# rewrite this file from scratch — see AGENTS.md.react-web for
# the convention.
[[file]]
src = "vite.config.ts"
how = "overwrite"
when = "once"

# Tailwind + PostCSS. tailwind.config.js stays `when = "once"`
# so per-project theme extensions (custom colours, fontFamily,
# keyframes) don't get reverted; postcss.config.js is static and
# safe to overwrite.
[[file]]
src = "postcss.config.js"
how = "overwrite"
when = "always"

[[file]]
src = "tailwind.config.js"
how = "overwrite"
when = "once"

# ESLint flat config — recommended JS + TS rules + react-hooks +
# react-refresh. Once-only because individual projects often add
# their own ignore patterns / custom rules.
[[file]]
src = "eslint.config.js"
how = "overwrite"
when = "once"

# index.html — Tera-rendered for the <title>. Once-only so the
# consumer's <head> tweaks (preconnect, fonts, OG tags) survive.
[[file]]
src = "index.html.tera"
dst = "index.html"
how = "overwrite"
when = "once"

# Minimal browser entry skeleton — `pnpm dev` boots a working page
# straight after init. All `when = "once"` so consumer code is
# never overwritten.
[[file]]
src = "src/main.tsx"
how = "overwrite"
when = "once"

[[file]]
src = "src/App.tsx"
how = "overwrite"
when = "once"

[[file]]
src = "src/index.css"
how = "overwrite"
when = "once"

[[file]]
src = "src/vite-env.d.ts"
how = "overwrite"
when = "once"

# Public assets — placeholder favicon. once-only.
[[file]]
src = "public/favicon.svg"
how = "overwrite"
when = "once"

# React-web-layer agent guidance.
[[file]]
src = "AGENTS.md.react-web"
dst = "AGENTS.md"
how = "merge-section"
when = "always"
marker = { begin = "<!-- kata:agents:react-web:begin -->", end = "<!-- kata:agents:react-web:end -->" }

# Renovate: repoint the consumer's `extends` at THIS layer's own
# preset (`default.json`), which extends the layer below it and adds
# whatever rules this layer owns.
#
# Every layer ships this same entry naming ITSELF; kata's compose rule
# (last layer wins on file conflicts) then resolves `extends` to the
# topmost APPLIED layer automatically. No layer needs to know what
# sits above it, and no preset var is involved.
#
# `how = "merge-json"` with `paths = ["extends"]` rewrites ONLY the
# `extends` array, leaving any consumer-added keys (labels, extra
# packageRules, …) untouched — unlike a blanket overwrite. The same
# `renovate.json` doubles as this repo's OWN Renovate config.
[[file]]
src = "renovate.json"
how = "merge-json"
when = "always"
paths = ["extends"]
